<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velvet Vault — The Midnight Gallery Heist</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f1e; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* The headless play-test writes its result here for the harness to read. */
  #test-result { position: absolute; left: -9999px; top: -9999px; }
</style>
</head>
<body>
<canvas id="game" aria-label="Velvet Vault: a top-down heist game. Cross three gallery wings, lift every treasure, dodge guard vision cones and cameras, and reach the getaway van."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<p id="test-result"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
